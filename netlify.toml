[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market"
  status = 200
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/webhook"
  status = 200
[[redirects]]
  from = "/api/cleanup"
  to = "/.netlify/functions/cleanup"
  status = 200
[[redirects]]
  from = "/ads.txt"
  to = "/.netlify/functions/ads-text"
  status = 200
[[redirects]]
  from = "/api/partner-search"
  to = "/.netlify/functions/partner-search"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
