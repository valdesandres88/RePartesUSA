name: RePartes USA checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in src/*.js netlify/functions/*.mjs; do node --check "$f"; done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Business logic tests
        run: npm test
      - name: Production build
        run: npm run build
