name: Customer feedback improvement bot
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-feedback-bot
  cancel-in-progress: false
jobs:
  improve:
    if: vars.FEEDBACK_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check activation
        run: |
          if [ "$OPENAI_KEY_PRESENT" != 'true' ]; then
            echo 'Add the OPENAI_API_KEY Actions secret before enabling the bot.'
            exit 1
          fi
      - name: Collect unhandled published feedback
        id: feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/feedback-bot.mjs collect
      - name: Preserve trusted publisher
        if: steps.feedback.outputs.ready == 'true'
        run: cp scripts/feedback-bot.mjs "$RUNNER_TEMP/repartes-feedback-publisher.mjs"
      - name: Install dependencies before sandboxed coding
        if: steps.feedback.outputs.ready == 'true'
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Investigate feedback and prepare a fix
        if: steps.feedback.outputs.ready == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/repartes-feedback-prompt.txt
      - name: Validate proposed changes
        if: steps.feedback.outputs.ready == 'true'
        run: npm run check
      - name: Open a draft pull request
        if: steps.feedback.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/repartes-feedback-publisher.mjs" publish
